<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="title desc">
  <title id="title">How Spate downloads a file</title>
  <desc id="desc">Five steps: capture the link, hand it to the app over native messaging and a token-checked local connection, plan by probing the server and preallocating one sparse file, fetch with up to 32 connections that each write their own range of that file, and finish by flushing and renaming with no merge step.</desc>
  <style>
    .surface { fill: #fcfcfb; stroke: rgba(11, 11, 11, 0.10); }
    .card { fill: #ffffff; stroke: #e1e0d9; }
    .accent { fill: #2a78d6; }
    .track { fill: #e1e0d9; }
    .chev { fill: none; stroke: #898781; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
    .t1 { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
    .t2 { fill: #52514e; font-size: 13px; }
    .muted { fill: #898781; font-size: 12px; }
    .num { fill: #ffffff; font-size: 13px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: rgba(255, 255, 255, 0.10); }
      .card { fill: #242423; stroke: #383835; }
      .accent { fill: #3987e5; }
      .track { fill: #383835; }
      .h, .t1 { fill: #f0efec; }
      .t2 { fill: #c3c2b7; }
    }
  </style>

  <rect class="surface" x="0.5" y="0.5" width="999" height="389" rx="12"/>
  <text class="h" x="20" y="38">From click to finished file</text>

  <!-- Step cards: 176 wide, 20 apart -->
  <g transform="translate(20 60)">
    <rect class="card" x="0.5" y="0.5" width="175" height="129" rx="10"/>
    <circle class="accent" cx="26" cy="28" r="13"/><text class="num" x="26" y="32.5" text-anchor="middle">1</text>
    <text class="t1" x="48" y="33">Capture</text>
    <text class="t2" x="14" y="70">Browser extension,</text>
    <text class="t2" x="14" y="89">pasted link, clipboard</text>
    <text class="t2" x="14" y="108">or the terminal</text>
  </g>
  <path class="chev" d="M201 120 l6 5 -6 5"/>
  <g transform="translate(216 60)">
    <rect class="card" x="0.5" y="0.5" width="175" height="129" rx="10"/>
    <circle class="accent" cx="26" cy="28" r="13"/><text class="num" x="26" y="32.5" text-anchor="middle">2</text>
    <text class="t1" x="48" y="33">Hand off</text>
    <text class="t2" x="14" y="70">Native messaging to</text>
    <text class="t2" x="14" y="89">spate-cli, then a</text>
    <text class="t2" x="14" y="108">token-locked local link</text>
  </g>
  <path class="chev" d="M397 120 l6 5 -6 5"/>
  <g transform="translate(412 60)">
    <rect class="card" x="0.5" y="0.5" width="175" height="129" rx="10"/>
    <circle class="accent" cx="26" cy="28" r="13"/><text class="num" x="26" y="32.5" text-anchor="middle">3</text>
    <text class="t1" x="48" y="33">Plan</text>
    <text class="t2" x="14" y="70">Probe size and resume</text>
    <text class="t2" x="14" y="89">support, then reserve</text>
    <text class="t2" x="14" y="108">one sparse file</text>
  </g>
  <path class="chev" d="M593 120 l6 5 -6 5"/>
  <g transform="translate(608 60)">
    <rect class="card" x="0.5" y="0.5" width="175" height="129" rx="10"/>
    <circle class="accent" cx="26" cy="28" r="13"/><text class="num" x="26" y="32.5" text-anchor="middle">4</text>
    <text class="t1" x="48" y="33">Fetch</text>
    <text class="t2" x="14" y="70">Up to 32 connections</text>
    <text class="t2" x="14" y="89">write in place; idle</text>
    <text class="t2" x="14" y="108">ones split the slowest</text>
  </g>
  <path class="chev" d="M789 120 l6 5 -6 5"/>
  <g transform="translate(804 60)">
    <rect class="card" x="0.5" y="0.5" width="175" height="129" rx="10"/>
    <circle class="accent" cx="26" cy="28" r="13"/><text class="num" x="26" y="32.5" text-anchor="middle">5</text>
    <text class="t1" x="48" y="33">Finish</text>
    <text class="t2" x="14" y="70">Flush and rename.</text>
    <text class="t2" x="14" y="89">No merge step, no</text>
    <text class="t2" x="14" y="108">second copy on disk</text>
  </g>

  <!-- The file during step 4: eight ranges, each filled by its own connection -->
  <text class="t1" x="20" y="236">Inside step 4: one file, eight connections</text>
  <g transform="translate(20 252)">
    <rect class="track" x="0" y="0" width="118" height="28" rx="4"/><rect class="accent" x="0" y="0" width="118" height="28" rx="4"/>
    <rect class="track" x="120" y="0" width="118" height="28" rx="4"/><rect class="accent" x="120" y="0" width="94" height="28" rx="4"/>
    <rect class="track" x="240" y="0" width="118" height="28" rx="4"/><rect class="accent" x="240" y="0" width="77" height="28" rx="4"/>
    <rect class="track" x="360" y="0" width="118" height="28" rx="4"/><rect class="accent" x="360" y="0" width="106" height="28" rx="4"/>
    <rect class="track" x="480" y="0" width="118" height="28" rx="4"/><rect class="accent" x="480" y="0" width="65" height="28" rx="4"/>
    <rect class="track" x="600" y="0" width="118" height="28" rx="4"/><rect class="accent" x="600" y="0" width="83" height="28" rx="4"/>
    <rect class="track" x="720" y="0" width="118" height="28" rx="4"/><rect class="accent" x="720" y="0" width="100" height="28" rx="4"/>
    <rect class="track" x="840" y="0" width="118" height="28" rx="4"/><rect class="accent" x="840" y="0" width="71" height="28" rx="4"/>
    <text class="muted" x="59" y="48" text-anchor="middle">conn 1 · done</text>
    <text class="muted" x="179" y="48" text-anchor="middle">conn 2</text>
    <text class="muted" x="299" y="48" text-anchor="middle">conn 3</text>
    <text class="muted" x="419" y="48" text-anchor="middle">conn 4</text>
    <text class="muted" x="539" y="48" text-anchor="middle">conn 5</text>
    <text class="muted" x="659" y="48" text-anchor="middle">conn 6</text>
    <text class="muted" x="779" y="48" text-anchor="middle">conn 7</text>
    <text class="muted" x="899" y="48" text-anchor="middle">conn 8</text>
  </g>
  <text class="t2" x="20" y="338">Each connection writes its own byte range straight into the final file. A connection that finishes early</text>
  <text class="t2" x="20" y="358">takes over half of the slowest remaining range, so all of them end at about the same moment.</text>
</svg>
