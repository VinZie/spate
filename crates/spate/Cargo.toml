[package]
name = "spate"
version = "0.2.0"
edition = "2024"
description = "Spate desktop download manager"
license = "MIT"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "clipboard", "links", "wayland", "x11"] }
egui_extras = { version = "0.37.0", default-features = false }
spate-core = { version = "0.2.0", path = "../spate-core" }
reqwest = { version = "0.13.5", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Unpacks the release package when the app updates itself, with the deflate
# decoder (flate2 + miniz_oxide) that image loading already compiles in.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"
