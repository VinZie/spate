name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or task, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Spate help?
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Workarounds you use today, examples from other tools, screenshots.
